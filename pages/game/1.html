
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #game {
            width: 10px;
            height: 10px;
            display: flex;
            justify-content: center;
            background-color: aqua;
            position: absolute;
            left: 0px;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        const game = document.getElementById('game');
        setInterval(() => {
            game.style.left += 10;
        });
    </script>
</body>    
</html>
